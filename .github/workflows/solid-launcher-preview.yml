name: Storage launcher preview
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  launcher:
    runs-on: ubuntu-latest
    outputs:
      pages_artifact: ${{ steps.pages_artifact.outputs.name }}
    env:
      RS_SOLID_TEST_PASSWORD: disposable-launcher-test-password
    steps:
      - uses: actions/checkout@v4
      - name: Check public app pages and sitemap
        run: python3 scripts/build-app-pages.py --check
      - uses: actions/checkout@v4
        with:
          repository: pondersource/remotestorage.js
          ref: 47cf02b312902298efcbfc8c7c6cd1bfb637e11c
          path: rs-solid-source
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm run build:all
        working-directory: rs-solid-source
      - uses: actions/checkout@v4
        with:
          repository: pondersource/remotestorage-widget
          ref: bce15da652105ddfcface5463b31468559b7c356
          path: rs-widget-source
      - run: npm ci && npm run build
        working-directory: rs-widget-source
      - uses: actions/checkout@v4
        with:
          repository: ontola/atomic-server
          ref: fb640fb54657ef826db8ec7ca55e24587faab1da
          path: atomic-launcher-source
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: atomic-launcher-source/browser/package.json
      - run: pnpm install --frozen-lockfile
        working-directory: atomic-launcher-source/browser
      - run: pnpm --filter @tomic/utils build
        working-directory: atomic-launcher-source/browser
      - run: npm ci
        working-directory: rs-solid-source/examples/solid
      - run: npx playwright install --with-deps chromium
        working-directory: rs-solid-source/examples/solid
      - run: node --test tests/lws-discovery.test.mjs tests/launcher-atomic.test.mjs
      - name: Verify vendored storage artifacts
        run: python3 scripts/verify-storage-preview.py --rs rs-solid-source --widget rs-widget-source
      - name: Stage site
        run: |
          mkdir preview
          git archive HEAD | tar -x -C preview
          # git archive includes the reviewed preview artifacts and their manifest.
          node scripts/build-atomic-launcher-sdk.mjs atomic-launcher-source preview/assets/js/atomic-sdk
      - name: Test launcher against Community Solid Server
        run: |
          (cd rs-solid-source/examples/solid && exec node tests/server.cjs) &
          python3 -m http.server 8000 --bind 127.0.0.1 --directory preview &
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT
          export PLAYWRIGHT_MODULE="$PWD/rs-solid-source/examples/solid/node_modules/playwright"
          export NODE_PATH="$PWD/rs-solid-source/examples/solid/node_modules"
          node --test tests/launcher-browser.test.cjs tests/launcher-solid.test.cjs tests/rs-apps-browser.test.cjs tests/app-pages-browser.test.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: solid-launcher-preview
          path: preview/
      - name: Select the Pages artifact for this attempt
        id: pages_artifact
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - run: touch preview/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          name: ${{ steps.pages_artifact.outputs.name }}
          path: preview/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: launcher
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: ${{ needs.launcher.outputs.pages_artifact }}
