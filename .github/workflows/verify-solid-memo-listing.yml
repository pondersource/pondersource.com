name: Launcher browser verification

on: push

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install --prefix "$RUNNER_TEMP/launcher-tests" --no-package-lock --ignore-scripts playwright@1.56.1
      - run: |
          "$RUNNER_TEMP/launcher-tests/node_modules/.bin/playwright" install --with-deps chromium
      - run: node --test tests/launcher-storage.test.mjs
      - run: |
          python3 -m http.server 8000 --bind 127.0.0.1 &
          server=$!
          trap 'kill "$server"' EXIT
          curl --retry 10 --retry-connrefused --fail --silent --output /dev/null http://127.0.0.1:8000/
          NODE_PATH="$RUNNER_TEMP/launcher-tests/node_modules" node --test tests/launcher-browser.test.cjs
